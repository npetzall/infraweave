[package]
name = "catalog-aws-apigw"
version.workspace = true
edition.workspace = true

[features]
default = ["aws"]
aws = ["dep:catalog-aws", "dep:lambda_http"]
mem = ["dep:catalog-mem", "dep:lambda_http"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { version = "0.7", features = ["json"] }
catalog-http = { path = "../catalog-http" }
http = "1"
serde = { version = "1.0", features = ["derive"] }
catalog-trait = { path = "../catalog-trait" }
catalog-aws = { path = "../catalog-aws", optional = true }
catalog-mem = { path = "../catalog-mem", optional = true }
lambda_http = { version = "0.13.0", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true

[[bin]]
name = "bootstrap"
path = "src/main.rs"
