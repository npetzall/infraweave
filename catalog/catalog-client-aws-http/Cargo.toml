[package]
name = "catalog-client-aws-http"
version.workspace = true
edition.workspace = true
description = "catalog-trait Catalog implementation that calls catalog-http-compatible REST APIs (e.g. behind API Gateway)."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
catalog-trait = { path = "../catalog-trait" }
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
axum = { version = "0.7", features = ["json"] }
catalog-client = { path = "../catalog-client" }
catalog-http = { path = "../catalog-http" }
catalog-mem = { path = "../catalog-mem" }
catalog-trait = { path = "../catalog-trait" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
